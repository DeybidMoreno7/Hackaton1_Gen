<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stryle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://unpkg.com/ionicons@4.5.10-0/dist/css/ionicons.min.css" rel="stylesheet">
    <title>Friticos Colombia</title>
</head>
<body>
<!-- Navbar -->
<div class="w-100">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

<a class="navbar-brand d-flex align-items-center" href="#">
    <img src="img.png" alt="Logo" class="logo-navbar">
    <span class="ms-2 fw-bold">Friticos Colombia</span>
</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse p-3" id="navbarSupportedContent">

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="icon ion-md-star me-2"></i>
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="icon ion-md-restaurant me-2"></i>
                            Menú
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="icon ion-md-people me-2"></i>
                            Sobre nosotros
                        </a>
                    </li>

                </ul>

                <form class="d-flex position-relative" role="search">
                    <input class="form-control me-2" type="search" placeholder="Buscar" aria-label="Buscar">
                    <button class="btn btn-search position-absolute end-0 top-50 translate-middle-y" type="submit">
                        <i class="icon ion-md-search"></i>
                    </button>
                </form>

            </div>
        </div>
    </nav>
</div>


<!-- Equipo por favor empezar desde aqui  -->


    <script src="app.js"></script>
</body>
</html>
